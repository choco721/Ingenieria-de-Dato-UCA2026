# Conexión de dbt. Usamos DuckDB: liviano, sin servidor, y capaz de leer
# Parquet directo desde MinIO (S3). El archivo .duckdb vive en el contenedor.
proyecto_datos:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: /opt/airflow/dbt/warehouse.duckdb
      threads: 4
      # Extensiones para que DuckDB pueda leer del lake (MinIO vía S3).
      extensions:
        - httpfs
        - parquet
      settings:
        s3_endpoint: "minio:9000"
        s3_access_key_id: "minioadmin"
        s3_secret_access_key: "minioadmin"
        s3_use_ssl: false
        s3_url_style: "path"
